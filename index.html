<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico">
  <title>DeadStop Crash</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #111827;
      --border: #374151;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --danger: #f87171;
      --canvas-bg: #0b1220;
      --green: #34d399;
      --yellow: #facc15;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }


    .app {
  display: grid;
  grid-template-columns: 1fr 390px;
  grid-template-rows: 1fr 24px 210px;
  height: calc(100vh - 50px);
  min-height: 0;
}

    .toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100% - 24px);
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(31, 41, 55, 0.92);
      backdrop-filter: blur(6px);
    }

    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      background: #253044;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { border-color: var(--accent); }
    button.danger:hover { border-color: var(--danger); }

    .canvas-wrap {
      position: relative;
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--canvas-bg);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .inspector {
  grid-column: 2;
  grid-row: 1 / span 3;
  overflow: auto;
  padding: 16px;
  background: var(--panel);
}

    .console {
      grid-column: 1;
      grid-row: 3;
      overflow: auto;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      background: #050912;
    }

    h2, h3, h4 {
      margin: 0 0 12px;
      font-weight: 650;
    }

    h3 { margin-top: 20px; }
    h4 { margin-top: 16px; color: var(--muted); }

    .muted { color: var(--muted); }

    .field { margin-bottom: 12px; }

    label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      color: var(--text);
      background: var(--panel-2);
    }

    input[readonly] {
      color: var(--muted);
      background: #0b1220;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hint, .card {
      margin-top: 12px;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      border-style: solid;
      background: rgba(17, 24, 39, 0.5);
    }

    .calc-card {
      border-color: #275342;
      background: rgba(16, 78, 56, 0.22);
    }

    .entity-list, .state-list, .event-list {
      display: grid;
      gap: 6px;
      margin: 8px 0 12px;
    }

    .pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #172033;
      cursor: pointer;
      text-align: left;
    }

  .pill.active {
    background: #2563eb;
    border-color: #60a5fa;
    box-shadow: 0 0 0 1px #93c5fd;
  }

    .pill small { color: var(--muted); }

    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .log-entry { margin-bottom: 4px; }
    .log-time { color: var(--muted); }
    .log-warn {
       color: #ffb347;  
    }
    .log-error {
       color: #d31204;  
    }
    .log-result {
      color: #4caf50;
      font-weight: 600;
    }
    .calc-button {
      background: #1f8f4d;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .calc-capable {
      color: #1f8f4d;
    }

    input[readonly] {
      
      color: #666;
      border: 1px dashed #aaa;
    }

    .wheel-drag-editor {
  margin: 0.75rem 0 1rem;
  padding: 0.75rem;
  border: 1px solid #334155;
  border-radius: 8px;
  background: #0f172a;
}

.wheel-drag-label,
.vehicle-rear-label {
  text-align: center;
  font-size: 0.8rem;
  color: #94a3b8;
  margin-bottom: 0.35rem;
}

.wheel-drag-row {
  display: grid;
  grid-template-columns: 1fr 70px 1fr;
  gap: 0.5rem;
  align-items: center;
}

.wheel-field label {
  text-align: center;
}

.vehicle-mini-diagram {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #cbd5e1;
}

.vehicle-nose {
  font-size: 0.9rem;
  line-height: 1;
}

.vehicle-body {
  width: 36px;
  height: 74px;
  border: 2px solid #64748b;
  border-radius: 8px;
  background: #1e293b;
}

.vehicle-rear-label {
  margin-top: 0.25rem;
}

.fraction {
  display: inline-block;
  vertical-align: middle;
  text-align: center;
}

.fraction .top {
  display: block;
  border-bottom: 1px solid currentColor;
  padding: 0 4px;
}

.fraction .bottom {
  display: block;
  padding: 0 4px;
}

.vehicle-nav-group {
  margin-bottom: 14px;
}

.vehicle-pill {
  margin-bottom: 6px;
}

.state-list {
  margin-left: 18px;
  padding-left: 10px;
  border-left: 2px solid #334155;
}

.state-pill {
  margin-bottom: 6px;
  font-size: 0.95em;
}

/* ===== Header ===== */



.app-header h1 {
  margin: 0;

  color: #f8fafc;
  font-size: 1.25rem;
  font-weight: 600;

  letter-spacing: 0.02em;
}

.app-header {
  height: 50px;

  display: flex;
  align-items: center;

  padding: 0 16px;

  background: #020617;
  border-bottom: 2px solid rgba(34, 197, 94, 0.5);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}

.header-version {
  color: #94a3b8;
  font-size: 0.8rem;
  font-weight: 500;
}

/* ===== Logo ===== */

.logo-wrap {
  width: 36px;
  height: 36px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255, 255, 255, 0.08);
  border-radius: 8px;
}

.logo-wrap img,
.logo-wrap svg {
  width: 24px;
  height: 24px;
}

/* ===== Toolbar ===== */

.toolbar {
  background: #1e293b;
  border-bottom: 1px solid #334155;

  padding: 8px;
}

/* ===== Optional Button Styling ===== */

.toolbar button {
  background: #334155;
  border: 1px solid #475569;
  color: #f8fafc;
}

.toolbar button:hover {
  background: #475569;
}

/* Calculate All button */
.calc-button {
  background: #16a34a !important;
  border-color: #22c55e !important;
}

.calc-button:hover {
  background: #15803d !important;
}

.status-bar {
  grid-column: 1;
  grid-row: 2;

  display: flex;
  align-items: center;
  gap: 18px;

  padding: 0 10px;

  background: #020617;
  border-top: 1px solid #1e293b;
  border-bottom: 1px solid #1e293b;

  color: #94a3b8;
  font-size: 12px;
  font-family: system-ui, sans-serif;
}

.status-bar span {
  white-space: nowrap;
}

#statusText {
  color: #cbd5e1;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.modal-backdrop.hidden {
  display: none;
}

.modal {
  background: var(--panel);
  color: var(--text, #e5e7eb);
  border: 1px solid #374151;
  border-radius: 12px;
  width: min(520px, 90vw);
  max-height: 85vh;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
}

.modal-header,
.modal-footer {
  padding: 12px 16px;
  border-bottom: 1px solid #374151;
}

.modal-footer {
  border-bottom: none;
  border-top: 1px solid #374151;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h2 {
  margin: 0;
  font-size: 1.1rem;
}

.modal-body {
  padding: 16px;
  overflow-y: auto;
}

.modal-x {
  background: transparent;
  border: none;
  color: inherit;
  font-size: 1.5rem;
  cursor: pointer;
}

.axis-widget {
  position: absolute;
  right: 30px; /* Controls the position of the overall widget */
  bottom: 30px; /* Controls the position of the overall widget */

  width: 82px;
  height: 82px;

  z-index: 1000;
  pointer-events: none;
}

.axis-origin {
  position: absolute;
  left: 26px;
  top: 38px;
  width: 7px;
  height: 7px;
  border: 2px solid #e5e7eb;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
}

.axis-x-line {
  position: absolute;
  left: 28px;
  top: 37px;
  width: 40px; /* This is the length of the blue x-axis line */
  height: 2px;
  background: #38bdf8;
}

.axis-y-line {
  position: absolute;
  left: 25px;
  top: 40px;
  width: 2px;
  height: 40px;
  background: #22c55e;
}

.axis-x-arrow {
  position: absolute;
  left: 64px; /* Blue x-axis arrow. Move this by any change made to x-axis length */
  top: 28px;
  color: #38bdf8;
  font-size: 15px;
}

.axis-y-arrow {
  position: absolute;
  left: 19px;
  top: 74px;
  color: #22c55e;
  font-size: 15px;
}

.axis-theta {
  position: absolute;
  left: 29px;
  top: 44px;

  color: #facc15;
  font-size: 18px;
}

.axis-label-x {
  position: absolute;
  left: 68px; /* Repositions X label */
  top: 44px; /* Repositions X label */
  color: #38bdf8;
  font-size: 12px;
  font-weight: 700;
}

.axis-label-y {
  position: absolute;
  left: 33px;
  top: 78px;
  color: #22c55e;
  font-size: 12px;
  font-weight: 700;
}

.axis-label-theta {
  position: absolute;
  left: 42px;
  top: 49px;

  color: #facc15;
  font-size: 11px;
  font-weight: 700;
}


</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="logo-wrap">
      <img src="0carcrash.svg" class="app-logo">
    </div>

    <h1>DeadStop Crash Reconstruction</h1>
  </div>

  <div class="header-version">
    v0.2.01-dev <!--0.2 will be yaw-->
  </div>
</header>


  <div class="app">
    <section class="canvas-wrap">
      <div class="toolbar">
        <button id="addVehicleBtn">Add Vehicle</button>
        <button id="addEventBtn">Add Event</button>
        <button id="deleteBtn" class="danger">Delete Selected</button>
        <button id="resetViewBtn">Reset View</button>
        <button id="clearConsoleBtn" onclick="clearConsole()">Clear Console</button>
        <button id="calculateAllBtn" class="calc-button" onclick="calculateAll()">Calculate All</button>
      </div>
     <div class="axis-widget">
      <div class="axis-origin"></div>
      <div class="axis-x-line"></div>
      <div class="axis-y-line"></div>
      <div class="axis-x-arrow">▶</div>
      <div class="axis-y-arrow">▼</div>
      <div class="axis-theta">⤸</div>
      <div class="axis-label-x">+X</div>
      <div class="axis-label-y">+Y</div>
      <div class="axis-label-theta">+θ</div>
    </div>
      <canvas id="scene"></canvas>
    </section>
    <div id="statusBar" class="status-bar">
      <span id="statusText">Ready</span>
      <span id="statusSelection">No selection</span>
      <span id="statusZoom">Zoom: 100%</span>
    </div>

    <aside class="inspector">
      <h2>Inspector</h2>
      <div id="inspectorContent"></div>
    </aside>

    <section class="console" id="console"></section>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Modal Title</h2>
        <button class="modal-x" onclick="closeModal()">×</button>
      </div>

      <div id="modalBody" class="modal-body"></div>

      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const consoleEl = document.getElementById('console');
    const inspectorContent = document.getElementById('inspectorContent');

    function clearConsole() {
      consoleEl.innerHTML = '';
    }

    function frac(numerator, denominator) {
      return `
      <span class="fraction">
        <span class="top">${numerator}</span>
        <span class="bottom">${denominator}</span>
      </span>
      `;
    }

    const state = {
      vehicles: [],
      events: [],
      selectedVehicleId: null,
      selectedStateId: null,
      selectedEventId: null,
      nextVehicleNum: 1,
      nextStateNum: 1,
      nextEventNum: 1,
      showPaths: true,
      camera: { x: 0, y: 0, zoom: 8 },
      interaction: {
        mode: null,
        pointerStart: null,
        stateStart: null,
        cameraStart: null
      }
    };

    // ------------------------------------------------------------
    // Event Type Registry
    // ------------------------------------------------------------
    // Add new event types here. The inspector automatically calls:
    // - defaultInputs()
    // - renderFields(event)
    // - calculate(eventContext)
    //
    // This keeps the Inspector generic while letting each event type
    // define its own fields and calculation placeholders.
    const eventTypeRegistry = {
      skidContinuedMotion: {
        label: 'Skid - Continued Motion',
        defaultInputs() {
          return {
            dragFactor: 0.70,
            gradePercent: 0,
            brakingEfficiency: 1.00,
            skidDistanceFt: null,
            useStateDistance: true,
            dragFactorMode: 'dynamic',
            endingSpeed: 0
          };
        },
        renderFields(event) {
          ensureEventInputs(event);
          return `
            <h4>Skid - Continued Motion Inputs</h4>

            <div class="field">
              <label>Static/Dynamic Drag Factor</label>
              <select data-target="event-input" data-prop="dragFactorMode">
                <option value="static"
                  ${event.inputs.dragFactorMode === 'static' ? 'selected' : ''}>
                  Use Static Drag Factor
                </option>
                <option value="dynamic"
                  ${event.inputs.dragFactorMode === 'dynamic' ? 'selected' : ''}>
                  Attempt Dynamic Drag Factor
                </option>
              </select>
            </div>
            <div class="row">
              <div class="field">
                <label>Roadway Drag Factor</label>
                <input type="number" step="0.01" data-target="event-input" data-prop="dragFactor" value="${valueOrBlank(event.inputs.dragFactor)}" />
              </div>
              <div class="field">
                <label>Grade (%)</label>
                <input type="number" step="0.1" data-target="event-input" data-prop="gradePercent" value="${valueOrBlank(event.inputs.gradePercent)}" />
              </div>
            </div>
            <div class="field">
              <label>Calculate & Apply Speed to Upstream State</label>
            </div>
            <button class="calc-button" id="skidStopCalculateBtn" onclick="calculateSkid()">Calculate</button>
          `;
        }
      },
      skidToStop: {
        label: 'Skid to Stop',
        defaultInputs() {
          return {
            dragFactor: 0.70,
            gradePercent: 0,
            brakingEfficiency: 1.00,
            skidDistanceFt: null,
            useStateDistance: true,
            dragFactorMode: 'dynamic'
          };
        },
        renderFields(event) {
          ensureEventInputs(event);
          return `
            <h4>Skid to Stop Inputs</h4>

            <div class="field">
              <label>Static/Dynamic Drag Factor</label>
              <select data-target="event-input" data-prop="dragFactorMode">
                <option value="static"
                  ${event.inputs.dragFactorMode === 'static' ? 'selected' : ''}>
                  Use Static Drag Factor
                </option>
                <option value="dynamic"
                  ${event.inputs.dragFactorMode === 'dynamic' ? 'selected' : ''}>
                  Attempt Dynamic Drag Factor
                </option>
              </select>
            </div>

            <!--
            <div class="field">
              <label>Manual skid distance, ft</label>
              <input type="number" step="0.1" data-target="event-input" data-prop="skidDistanceFt" value="${valueOrBlank(event.inputs.skidDistanceFt)}" />
            </div>
            -->
            <div class="row">
              <div class="field">
                <label>Roadway Drag Factor</label>
                <input type="number" step="0.01" data-target="event-input" data-prop="dragFactor" value="${valueOrBlank(event.inputs.dragFactor)}" />
              </div>
              <div class="field">
                <label>Grade (%)</label>
                <input type="number" step="0.1" data-target="event-input" data-prop="gradePercent" value="${valueOrBlank(event.inputs.gradePercent)}" />
              </div>
            </div>
            <!--
            <div class="field">
              <label>Braking efficiency</label>
              <input type="number" step="0.01" data-target="event-input" data-prop="brakingEfficiency" value="${valueOrBlank(event.inputs.brakingEfficiency)}" />
            </div>
            ${renderCalculatedOutputs(event)}
            -->
            <div class="field">
              <label>Calculate & Apply Skid-to-Stop to Upstream/Downstream States</label>
            </div>
            <button class="calc-button" id="skidStopCalculateBtn" onclick="calculateSkid()">Calculate</button>
          `;
        }
      },
      yaw: {
        label: 'Yaw',
        defaultInputs() {
          return {
            chordLength: null,
            middleOrd: null,
            radiusFt: 150,
            dragFactor: 0.75,
            superelevationPercent: 0,
            yawDirection: 'cw'
          };
        },
        renderFields(event) {
          ensureEventInputs(event);
          return `
            <h4>Yaw - Critical Speed Inputs</h4>

            <div class="field">
              <label>Yaw Direction</label>
              <select
                data-target="event-input"
                data-prop="yawDirection"
                data-type="string">
                <option value="cw"
                  ${event.inputs.yawDirection === 'cw' ? 'selected' : ''}>
                  Clockwise
                </option>
                <option value="ccw"
                  ${event.inputs.yawDirection === 'ccw' ? 'selected' : ''}>
                  Counterclockwise
                </option>
              </select>
            </div>
            <div class="row">
              <div class="field">
                <label>Roadway Drag Factor</label>
                <input type="number" step="0.01" data-target="event-input" data-prop="dragFactor" value="${valueOrBlank(event.inputs.dragFactor)}" />
              </div>
              <div class="field">
                <label>Superelevation, %</label>
                <input type="number" step="0.1" data-target="event-input" data-prop="superelevationPercent" value="${valueOrBlank(event.inputs.superelevationPercent)}" />
              </div>
            </div>
            <div class="field">
              <label>Yaw Mark Dimensions</labels>
            </div>
            <div class="row">
              <div class="field">
                <label>Chord Length C (ft)</label>
                <input type="number" step="0.1" data-target="event-input" data-prop="chordLength" value="${valueOrBlank(event.inputs.chordLength)}" />
              </div>
              <div class="field">
                <label>Middle Ordinate m (ft)</label>
                <input type="number" step="0.01" data-target="event-input" data-prop="middleOrd" value="${valueOrBlank(event.inputs.middleOrd)}" />
              </div>
            </div>

            <div class="field">
                <label class="calc-capable">Radius r (ft)</label>
                <input type="number" step="0.1" data-target="event-input" data-prop="radiusFt" value="${valueOrBlank(event.inputs.radiusFt)}" />
            </div>          

          `;
        }

      }
      /*
      custom: {
        label: 'Custom / Notes Only',
        defaultInputs() {
          return { customField: '' };
        },
        renderFields(event) {
          ensureEventInputs(event);
          return `
            <h4>Custom Event Inputs</h4>
            <div class="field">
              <label>Custom field</label>
              <input data-target="event-input" data-prop="customField" value="${escapeHtml(event.inputs.customField || '')}" />
            </div>
            ${renderCalculatedOutputs(event)}
          `;
        },
        calculate({ event }) {
          event.calculated = { message: 'No calculation defined for custom event.' };
          return event.calculated;
        }
      } */
    };

    class Vehicle {
      constructor({ label = null, color = null } = {}) {
        this.id = `veh-${state.nextVehicleNum}`;
        this.label = label || `Vehicle ${state.nextVehicleNum}`;
        this.color = color || vehicleColor(state.nextVehicleNum);
        this.length = 16;
        this.width = 6;
        this.height = null;
        this.weight = 5300;
        this.wheelbase = null;
        this.weightRatioFront = 60;
        this.weightRatioRear = 40;
        this.lxf = null;
        this.lxr = null;
        this.lz = null;
        this.h = null;
        this.rh = null;
        this.r = null;
        this.wh = null;
        this.states = [];
        state.nextVehicleNum++;
      }
    }

    class VehicleState {
      constructor(vehicle, {
        x = 0,
        y = 0,
        length = 16,
        width = 6,
        headingDeg = 0,
        trajectoryDeg = 0,
        speedMph = null,
        massLb = 4000,
        dragFactorFL = 0.7,
        dragFactorFR = 0.7,
        dragFactorBL = 0.7,
        dragFactorBR = 0.7,
        stateLabel = null,
        timeLabel = '',
        notes = ''
      } = {}) {
        this.id = `state-${state.nextStateNum}`;
        this.vehicleId = vehicle.id;
        this.stateLabel = stateLabel || `State ${vehicle.states.length + 1}`;
        this.timeLabel = timeLabel;
        this.x = x;
        this.y = y;
        this.length = length;
        this.width = width;
        this.headingDeg = headingDeg;
        this.trajectoryDeg = trajectoryDeg;
        this.speedMph = speedMph;
        this.massLb = massLb;
        this.dragFactorFL = dragFactorFL;
        this.dragFactorFR = dragFactorFR;
        this.dragFactorBL = dragFactorBL;
        this.dragFactorBR = dragFactorBR;
        this.notes = notes;
        state.nextStateNum++;
      }
    }


    class EventLink {
      constructor({ vehicleId, fromStateId, toStateId, eventType = 'skidToStop', label = null, notes = '' }) {
        this.id = `event-${state.nextEventNum}`;
        this.vehicleId = vehicleId;
        this.fromStateId = fromStateId;
        this.toStateId = toStateId;
        this.eventType = eventType;
        this.label = label || `Event ${state.nextEventNum}`;
        this.inputs = getEventDefinition(eventType).defaultInputs();
        this.calculated = {};
        this.notes = notes;
        state.nextEventNum++;
      }
    }

    function checkMissingCalcReqs(entity, reqs) {
      // Returns any missing calculation requirements
      result = [];
      for (const req of reqs) {
        if (entity[req] != null) {
          continue;
        }
        else {
          result.push(req);
        }
      }
      return result;
    }

    function calculateStaticDragFactor(vehState) {
      const vehicle = findVehicle(vehState.vehicleId);

      log(`Calculating f<sub>Long Static</sub> for ${vehicle.label} at ${vehState.stateLabel}:`)
      
      let fail = false;
      if (vehicle.weight == null) {
        log(`Weight for ${vehicle.label} has not been specified.`, 'error');
        fail = true;
      }
      if (vehicle.weightRatioFront == null) {
        log(`Weight Ratio for ${vehicle.label} has not been specified.`, 'error');
        fail = true;
      }
      if (vehState.dragFactorFR == null || vehState.dragFactorFL == null || vehState.dragFactorBR == null || vehState.dragFactorBL == null) {
        log(`Complete set of wheel drag factors for ${vehicle.label} ${vehState.stateLabel} has not been specified.`, 'error');
        fail = true;
      }
      if (fail) {
        log(`Static Drag Factor cannot be determined.`, 'error');
        return 'fail';
      }
      
      const Wf = vehicle.weightRatioFront/100 * vehicle.weight;
      const Wr = vehicle.weightRatioRear/100 * vehicle.weight;
      frontWheelWeights = Wf / 2;
      rearWheelWeights = Wr / 2;
      log(`w<sub>f</sub> = Front Weight Ratio x w = ${vehicle.weightRatioFront/100} x ${vehicle.weight} = ${Wf} lbs`);
      log(`w<sub>FR</sub> = w<sub>FL</sub> = ${frac('w<sub>f</sub>', '2')} = ${frac(Wf, 2)} = ${frontWheelWeights} lbs`);
      log(`f<sub>Long Static</sub> = ${frac('f<sub>FR</sub>w<sub>FR</sub> + f<sub>FL</sub>w<sub>FL</sub> + f<sub>BR</sub>w<sub>BR</sub> + f<sub>BL</sub>w<sub>BL</sub>', 'w<sub>Total</sub>')}`);
      log(`f<sub>Long Static</sub> = ${frac(`(${vehState.dragFactorFR})(${frontWheelWeights}) + (${vehState.dragFactorFL})(${frontWheelWeights}) + (${vehState.dragFactorBR})(${rearWheelWeights}) + (${vehState.dragFactorBL})(${rearWheelWeights})`, `${vehicle.weight}`)}`);
      const numerator = vehState.dragFactorFR*frontWheelWeights + vehState.dragFactorFL*frontWheelWeights + vehState.dragFactorBR*rearWheelWeights + vehState.dragFactorBL*rearWheelWeights;
      const staticDragFactor = numerator / vehicle.weight;
      log(`f<sub>Long Static</sub> = ${staticDragFactor}`);

      return {
        'fLongf': staticDragFactor,
        'fLongr': staticDragFactor
      };

    }

    function calculateDynamicDragFactor(vehState) {
      const vehicle = findVehicle(vehState.vehicleId);

      let fail = false;
      if (vehicle.weight == null) {
        log(`Weight for ${vehicle.label} has not been specified.`, 'error');
        fail = true;
      }
      if (vehicle.weightRatioFront == null) {
        log(`Weight Ratio for ${vehicle.label} has not been specified.`, 'error');
        fail = true;
      }
      if (vehicle.wheelbase == null) {
        log(`Wheelbase l<sub>wb</sub> for ${vehicle.label} has not been specified.`, 'error');
        fail = true;
      }
      if (vehState.dragFactorFR == null || vehState.dragFactorFL == null || vehState.dragFactorBR == null || vehState.dragFactorBL == null) {
        log(`Complete set of wheel drag factors for ${vehicle.label} ${vehState.stateLabel} has not been specified.`, 'error');
        fail = true;
      }
      if (vehicle.lxf == null) {
        log(`l<sub>xf</sub> for ${vehicle.label} has not been specified.`, 'error');
        fail = true;
      }
      if (vehicle.lxr == null) {
        log(`l<sub>xr</sub> for ${vehicle.label} has not been specified.`, 'error');
        fail = true;
      }
      if (vehicle.lz == null) {
        log(`l<sub>z</sub> for ${vehicle.label} has not been specified.`, 'error');
        fail = true;
      }
      if (fail) {
        log(`Dynamic Drag Factor cannot be determined.`, 'error');
        return 'fail';
      }

      const Ff = (vehState.dragFactorFR + vehState.dragFactorFL) / 2;
      log(`Calculating f<sub>Long<sub>f</sub></sub> for ${vehicle.label} at ${vehState.stateLabel}:`)
      log(`f<sub>f</sub> = ${frac('f<sub>FR</sub> + f<sub>FL</sub>', '2')} = ${frac(`${vehState.dragFactorFR} + ${vehState.dragFactorFL}`, '2')} = ${Ff}`, 'result');
      
      const Fr = (vehState.dragFactorBR + vehState.dragFactorBL) / 2;
      log(`f<sub>r</sub> = ${frac('f<sub>BR</sub> + f<sub>BL</sub>', '2')} = ${frac(`${vehState.dragFactorBR} + ${vehState.dragFactorBL}`, '2')} = ${Fr}`, 'result');

      // fLongf
      log(`f<sub>long<sub>f</sub></sub> = ${frac(`l<sub>wb</sub>f<sub>f</sub> - l<sub>x<sub>f</sub></sub>(f<sub>f</sub> - f<sub>r</sub>)`, `l<sub>wb</sub> - l<sub>z</sub>(f<sub>f</sub> - f<sub>r</sub>)`)}`);
      log(`f<sub>long<sub>f</sub></sub> = ${frac(`(${vehicle.wheelbase})(${Ff}) - (${vehicle.lxf})(${Ff} - ${Fr})`, `(${vehicle.wheelbase}) - (${vehicle.lz})(${Ff} - ${Fr})`)}`);
      const fLongf = round((vehicle.wheelbase*Ff - vehicle.lxf*(Ff-Fr)) / (vehicle.wheelbase - vehicle.lz*(Ff-Fr)),3);
      log(`f<sub>long<sub>f</sub></sub> = ${fLongf} ft`, 'result');

      // fLongr
      log(`f<sub>long<sub>r</sub></sub> = ${frac(`l<sub>wb</sub>f<sub>r</sub> - l<sub>x<sub>r</sub></sub>(f<sub>r</sub> - f<sub>f</sub>)`, `l<sub>wb</sub> - l<sub>z</sub>(f<sub>r</sub> - f<sub>f</sub>)`)}`);
      log(`f<sub>long<sub>r</sub></sub> = ${frac(`(${vehicle.wheelbase})(${Ff}) - (${vehicle.lxr})(${Fr} - ${Ff})`, `(${vehicle.wheelbase}) - (${vehicle.lz})(${Fr} - ${Ff})`)}`);
      const fLongr = round((vehicle.wheelbase*Fr - vehicle.lxr*(Fr-Ff)) / (vehicle.wheelbase - vehicle.lz*(Fr-Ff)),3);
      log(`f<sub>long<sub>r</sub></sub> = ${fLongr} ft`, 'result');

      return {
        'fLongf': fLongf,
        'fLongr': fLongr
      };

    }


    function calculateSkid(event = null) {
      if (event == null) {
        // Logic for finding event, if none provided
        event = state.events.find(e => e.id === state.selectedEventId);
      }
      
      log('---------------------------------------------');
      log('Start ' + event.label + ' calculations.');
      log('---------------------------------------------');

      // Set downstream vehicle speed to zero (i.e. skid to stop)
      downstreamState = findState(event.toStateId);
      const vehicle = findVehicle(downstreamState.vehicleId);
      if (event.eventType == 'skidToStop') {
        downstreamState.speedMph = 0;
        log(`Setting downstream vehicle state (${vehicle.label}, ${downstreamState.stateLabel}) to 0 mph (i.e. skid-to-stop).`)
      }

      // Set upstream vehicle speed from skid calculation
      upstreamState = findState(event.fromStateId);

      const distance = round(distanceBetweenStatesIds(event.fromStateId, event.toStateId), 2);


      let dragFactor = 0;

      // Figure dynamic drag factor if user wanted it
      if (event.inputs.dragFactorMode === 'dynamic')
      {
        dynamicDragFactor = calculateDynamicDragFactor(upstreamState);
        dragFactor = dynamicDragFactor;
        if (dynamicDragFactor === 'fail') {
          log('Dynamic Drag Factor calculation failed. Reverting to Static Drag Factor...', 'warn')
          staticDragFactor = calculateStaticDragFactor(upstreamState);
          if (staticDragFactor === 'fail') {
            log(`Calculation failed.`, 'error');
            return;
          }
          dragFactor = staticDragFactor;
        }
      }
      else {
        staticDragFactor = calculateStaticDragFactor(upstreamState);
        if (staticDragFactor === 'fail') {
          log(`Calculation failed.`, 'error');
          return;
        }
        dragFactor = staticDragFactor;
      }

      const grade = event.inputs.gradePercent / 100;
      let gradeSymbol = '+';
      if (grade < 0) {
        gradeSymbol = '';
      }

      // Check if there is any side skid
      let sideSkid = false;
      if (upstreamState.trajectoryDeg - upstreamState.headingDeg != 0) {
        sideSkid = true;
      }
      if (upstreamState.headingDeg - downstreamState.headingDeg != 0) {
        sideSkid = true;
      }

      if (!sideSkid) {
        // No side skid
        log('No side skid or rear skid detected between upstream and downstream states.');
        if (event.eventType == 'skidToStop') {
          // Skid to stop equation
          log(`S<sub>${upstreamState.stateLabel}</sub> = √(30d(f±G)) = √(30(${distance})(${dragFactor['fLongf']} ${gradeSymbol} ${grade}))`);
          speed = Math.sqrt(30*distance*(dragFactor['fLongf']+grade));
          upstreamState.speedMph = round(speed, 2);
          log(`S<sub>${upstreamState.stateLabel}</sub> = ${upstreamState.speedMph} mph`, 'result');
        }
        else
        {
          // Continuing motion equation
          log(`S<sub>${upstreamState.stateLabel}</sub> = √(S<sub>${downstreamState.stateLabel}</sub><sup>2</sup> + 30d(f±G)) = √(${downstreamState.speedMph}<sup>2</sup> + 30(${distance})(${dragFactor['fLongf']} ${gradeSymbol} ${grade}))`);
          speed = Math.sqrt(downstreamState.speedMph**2 + 30*distance*(dragFactor['fLongf']+grade));
          upstreamState.speedMph = round(speed, 2);
          log(`S<sub>${upstreamState.stateLabel}</sub> = ${upstreamState.speedMph} mph`, 'result');
        }
      }
      else {
        // Side skid
        log('Side skid and/or rear leading skid detected between upstream and downstream states.');
        // Difference of -90 to 90, use fLongf
        // Difference of 90 to 180 or -90 to -180, use fLongr

        // Upstream drag factor
        log(`${upstreamState.stateLabel} effective drag:`)
        let angle = upstreamState.headingDeg - upstreamState.trajectoryDeg;
        let angleRad = angle * Math.PI / 180;
        const fLat = event.inputs.dragFactor;
        log(`β = Heading - Trajectory = ${upstreamState.headingDeg}° - ${upstreamState.trajectoryDeg}° = ${angle}°`);
        if (angle >= -90 && angle <= 90) {
          fLong = dragFactor['fLongf'];
          log(`For -90° ≤ β ≤ 90°, f<sub>long</sub> = f<sub>long<sub>f</sub></sub> = ${fLong}`);
        }
        else {
          fLong = dragFactor['fLongr'];
          log(`For -90° > β or β > 90°, f<sub>long</sub> = f<sub>long<sub>r</sub></sub> = ${fLong}`);
        }
        log(`f<sub>lat</sub> = f<sub>roadway</sub> = ${fLat}`);
        log(`f<sub>β<sub>${upstreamState.stateLabel}</sub></sub> = √((f<sub>lat</sub>sinβ)<sup>2</sup> + (f<sub>long</sub>cosβ)<sup>2</sup>)`);
        log(`f<sub>β<sub>${upstreamState.stateLabel}</sub></sub> = √((${fLat}sin${angle}°)<sup>2</sup> + (${fLong}cos${angle}°)<sup>2</sup>)`);
        let fBeta1 = round(Math.sqrt((fLat*Math.sin(angleRad))**2 + (fLong*Math.cos(angleRad))**2), 3);
        log(`f<sub>β<sub>${upstreamState.stateLabel}</sub></sub> = ${fBeta1}`);

        // Downstream drag factor
        log(`${downstreamState.stateLabel} effective drag:`)
        angle = downstreamState.headingDeg - downstreamState.trajectoryDeg;
        angleRad = angle * Math.PI / 180;
        log(`β = Trajectory - Heading = ${downstreamState.headingDeg}° - ${downstreamState.trajectoryDeg}° = ${angle}°`);
        if (angle >= -90 && angle <= 90) {
          fLong = dragFactor['fLongf'];
          log(`For -90° ≤ β ≤ 90°, f<sub>long</sub> = f<sub>long<sub>f</sub></sub> = ${fLong}`);
        }
        else {
          fLong = dragFactor['fLongr'];
          log(`For -90° > β or β > 90°, f<sub>long</sub> = f<sub>long<sub>r</sub></sub> = ${fLong}`);
        }
        log(`f<sub>lat</sub> = f<sub>roadway</sub> = ${fLat}`);
        log(`f<sub>β<sub>${downstreamState.stateLabel}</sub></sub> = √((f<sub>lat</sub>sinβ)<sup>2</sup> + (f<sub>long</sub>cosβ)<sup>2</sup>)`);
        log(`f<sub>β<sub>${downstreamState.stateLabel}</sub></sub> = √((${fLat}sin${angle}°)<sup>2</sup> + (${fLong}cos${angle}°)<sup>2</sup>)`);
        let fBeta2 = round(Math.sqrt((fLat*Math.sin(angleRad))**2 + (fLong*Math.cos(angleRad))**2), 3);
        log(`f<sub>β<sub>${downstreamState.stateLabel}</sub></sub> = ${fBeta2}`);

        // then avg results for use over the event
        log(`f<sub>${event.label}</sub> = ${frac(`f<sub>${upstreamState.stateLabel}</sub> + f<sub>${downstreamState.stateLabel}</sub>`, `2`)}`);
        log(`f<sub>${event.label}</sub> = ${frac(`${fBeta1} + ${fBeta2}`, `2`)}`);
        fEvent = round((fBeta1 + fBeta2) / 2, 3);
        log(`f<sub>${event.label}</sub> = ${fEvent}`);

        // Now can calculate upstream speed
        if (event.eventType == 'skidToStop') {
          // Skid to stop equation
          log(`S<sub>${upstreamState.stateLabel}</sub> = √(30d(f±G)) = √(30(${distance})(${fEvent} ${gradeSymbol} ${grade}))`);
          speed = Math.sqrt(30*distance*(fEvent+grade));
          upstreamState.speedMph = round(speed, 2);
          log(`S<sub>${upstreamState.stateLabel}</sub> = ${upstreamState.speedMph} mph`, 'result');
        }
        else
        {
          // Continuing motion equation
          log(`S<sub>${upstreamState.stateLabel}</sub> = √(S<sub>${downstreamState.stateLabel}</sub><sup>2</sup> + 30d(f±G)) = √(${downstreamState.speedMph}<sup>2</sup> + 30(${distance})(${fEvent} ${gradeSymbol} ${grade}))`);
          speed = Math.sqrt(downstreamState.speedMph**2 + 30*distance*(fEvent+grade));
          upstreamState.speedMph = round(speed, 2);
          log(`S<sub>${upstreamState.stateLabel}</sub> = ${upstreamState.speedMph} mph`, 'result');
        }

      }

      draw();
      
    }

    function calculateVehicle(vehicle = null) {
      // Get the selected vehicle if not provided and log start of calc
      if (vehicle == null) {
        vehicle = state.vehicles.find(v => v.id === state.selectedVehicleId);
      }
      log('---------------------------------------------');
      log('Start ' + vehicle.label + ' calculations.');
      log('---------------------------------------------');
      
      // Calculate and log h
      log("h calculation:");
      let missingReqs = checkMissingCalcReqs(vehicle, ['rh', 'r']);
      if (missingReqs.length == 0) {
        let h = vehicle.rh - vehicle.r;
        vehicle.h = round(h, 3);
        log("h = r<sub>h</sub> - r = " + vehicle.rh.toFixed(3) + " - " + vehicle.r.toFixed(3)); 
        log("h = " + h.toFixed(3) + " ft", 'result');
      }
      else {
        log("h is indeterminate, missing requirements: " + missingReqs, 'warn');
      }

      // Calculate and log lxf
      // lxf=Wr*Lwb/w
      log("l<sub>xf</sub> calculation:");
      missingReqs = checkMissingCalcReqs(vehicle, ['weight', 'weightRatioRear', 'wheelbase']);
      if (missingReqs.length == 0) {
        let lxf = ((.01*vehicle.weightRatioRear*vehicle.weight) * vehicle.wheelbase) / vehicle.weight;
        vehicle.lxf = round(lxf, 3);
        log(
          `L<sub>xf</sub> = ${frac(`w<sub>r</sub>l<sub>wb</sub>`,`w`)} = ` +
          `${frac(`(${vehicle.weightRatioRear.toFixed(2)/100})(${vehicle.weight.toFixed(2)})(${vehicle.wheelbase.toFixed(2)})`, `${vehicle.weight.toFixed(2)}`)}`
        );
        log("l<sub>xf</sub> = " + lxf.toFixed(3) + " ft", 'result');
      }
      else {
        log("l<sub>xf</sub> is indeterminate, missing requirements: " + missingReqs, 'warn');
      }

      // Calculate and log lxr
      // lxr=Wf*Lwb/w
      log("l<sub>xr</sub> calculation:");
      missingReqs = checkMissingCalcReqs(vehicle, ['weight', 'weightRatioFront', 'wheelbase']);
      if (missingReqs.length == 0) {
        let lxr = ((.01*vehicle.weightRatioFront*vehicle.weight) * vehicle.wheelbase) / vehicle.weight;
        vehicle.lxr = round(lxr, 3);
        log(
          `l<sub>xr</sub> = ${frac(`w<sub>f</sub>l<sub>wb</sub>`, 'w')} = ` +
          `${frac(`(${vehicle.weightRatioFront.toFixed(2)})(${vehicle.weight.toFixed(2)})(${vehicle.wheelbase.toFixed(2)})`,`${vehicle.weight.toFixed(2)}`)}`);
        log("l<sub>xr</sub> = " + lxr.toFixed(3) + " ft", 'result');
      }
      else {
        log("l<sub>xr</sub> is indeterminate, missing requirements: " + missingReqs, 'warn');
      }

      // Calculate and log lxz
      // lz=(Lwb*sqrt(Lwb**2-h**2)*(Wh-Wf))/(h*W)+r
      log("l<sub>z</sub> calculation:");
      missingReqs = checkMissingCalcReqs(vehicle, ['weight', 'weightRatioFront', 'wheelbase', 'wh', 'h', 'r']);
      if (missingReqs.length == 0) {
        let lz = (vehicle.wheelbase * Math.sqrt(vehicle.wheelbase**2 - vehicle.h**2) * (vehicle.wh - (.01*vehicle.weightRatioFront*vehicle.weight))) / (vehicle.h * vehicle.weight) + vehicle.r;
        vehicle.lz = round(lz, 3);
        
        log(`l<sub>z</sub> = ${frac(`l<sub>wb</sub>√(l<sub>wb</sub><sup>2</sup> - h<sup>2</sup>)(w<sub>h</sub> - w<sub>f</sub>)`, `hw`)} + r`);
        log(`l<sub>z</sub> = ${frac(`(${vehicle.wheelbase})√((${vehicle.wheelbase})<sup>2</sup> - (${vehicle.h})<sup>2</sup>)(${vehicle.wh} - ((${vehicle.weightRatioFront/100})(${vehicle.weight})))`, `(${vehicle.h})(${vehicle.weight})`)} + ${vehicle.r}`);
        log("l<sub>z</sub> = " + lz.toFixed(3) + " ft", 'result');
      }
      else {
        log("l<sub>z</sub> is indeterminate, missing requirements: " + missingReqs + ". Checking for specified height...", 'warn');
        if (vehicle.height != null) {
          log(`l<sub>z</sub> ≈ ${frac('h<sub>vehicle</sub>', '3')} = ${frac(`${vehicle.height}`,'3')}`);
          vehicle.lz = round(vehicle.height / 3, 3);
          log(`l<sub>z</sub> ≈ ${vehicle.lz} ft`, 'result');
        }
        else {
          log("Vehicle height not specified. l<sub>z</sub> is indeterminate.", 'warn');
        }
      }

      // Log end of calc and update inspector
      log('---------------------------------------------');
      log('End ' + vehicle.label + ' calculations.');
      log('---------------------------------------------');
      renderInspector();
    }

    function getVehicleEventsBackward(vehicleId) {
      const vehicleEvents = state.events.filter(e => e.vehicleId === vehicleId);

      const eventByToStateId = new Map(
        vehicleEvents.map(e => [e.toStateId, e])
      );

      const eventByFromStateId = new Map(
        vehicleEvents.map(e => [e.fromStateId, e])
      );

      // End state = a toState that is never used as a fromState
      const endEvent = vehicleEvents.find(e => !eventByFromStateId.has(e.toStateId));
      if (!endEvent) return [];

      const ordered = [];
      let currentEvent = endEvent;

      while (currentEvent) {
        ordered.push(currentEvent);
        currentEvent = eventByToStateId.get(currentEvent.fromStateId);
      }

      return ordered; // backwards order
    }

    function calculateAll() {
      log('---------------------------------------------');
      log('Start Calculate All.');
      log('---------------------------------------------');
      for (vehicle of state.vehicles) {
        calculateVehicle(findVehicle(vehicle.id));
        const vehicleEvents = getVehicleEventsBackward(vehicle.id);
        // Make sure a chain does not have more than 1 skid to stop
        const skidToStopEvents = vehicleEvents.filter(e => e.eventType === 'skidToStop');
        if (skidToStopEvents.length > 1) {
          log(`Error: Event chain on ${vehicle.label} contains more than 1 skid-to-stop event. Aborting.`, 'error');
          log('---------------------------------------------');
          log('End Calculate All.');
          log('---------------------------------------------');
          return;
        }
        // If there is a skid-to-stop event, it must be the final event in the chain
        if (skidToStopEvents.length === 1) {
          if (vehicleEvents[0].eventType != 'skidToStop') {
            log(`Error: Event chain on ${vehicle.label} has a skid-to-stop event that is not the final event. Aborting.`, 'error');
            log('---------------------------------------------');
            log('End Calculate All.');
            log('---------------------------------------------');
            return;
          }
        }
        for (event of vehicleEvents) {
          switch (event.eventType) {
            case 'skidToStop':
            case 'skidContinuedMotion':
              calculateSkid(event);
              break;

            case 'yaw':
              console.log(calculateYaw(event));
              break;
          }
        }
      }
      log('---------------------------------------------');
      log('End Calculate All.');
      log('---------------------------------------------');
    }

    function getEventDefinition(eventType) {
      return eventTypeRegistry[eventType] || eventTypeRegistry.custom;
    }

    function ensureEventInputs(event) {
      const defaults = getEventDefinition(event.eventType).defaultInputs();
      event.inputs = { ...defaults, ...(event.inputs || {}) };
      event.calculated = event.calculated || {};
    }

    function vehicleColor(num) {
      const colors = ['#60a5fa', '#34d399', '#f87171', '#facc15', '#c084fc', '#fb923c'];
      return colors[(num - 1) % colors.length];
    }

    function log(message, type = 'info') {
      const time = new Date().toLocaleString();
      const div = document.createElement('div');
      let className = 'log-entry';
      if (type === 'warn') {
        className += ' log-warn';
      }
      else if (type === 'result') {
        className += ' log-result';
      }
      else if (type === 'error') {
        className += ' log-error';
      }
      div.className = className;
      div.innerHTML = `
        <span class="log-time">[${time}]</span>
        ${message}
      `;
      consoleEl.appendChild(div);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function escapeHtml(text) {
      return String(text ?? '').replace(/[&<>'"]/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[c]));
    }

    function valueOrBlank(value) {
      return value === null || value === undefined ? '' : escapeHtml(value);
    }

    function round(value, digits = 2) {
      const factor = 10 ** digits;
      return Math.round(Number(value || 0) * factor) / factor;
    }

    function distanceBetweenStates(a, b) {
      return Math.hypot(b.x - a.x, b.y - a.y);
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function screenToWorld(sx, sy) {
      const rect = canvas.getBoundingClientRect();
      const cx = sx - rect.left;
      const cy = sy - rect.top;
      return {
        x: (cx - rect.width / 2) / state.camera.zoom - state.camera.x,
        y: (cy - rect.height / 2) / state.camera.zoom - state.camera.y
      };
    }

    function worldToScreen(wx, wy) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (wx + state.camera.x) * state.camera.zoom + rect.width / 2,
        y: (wy + state.camera.y) * state.camera.zoom + rect.height / 2
      };
    }

    function updateStatusBar(message = 'Ready') {
      const statusText = document.getElementById('statusText');
      const statusSelection = document.getElementById('statusSelection');
      const statusZoom = document.getElementById('statusZoom');

      if (!statusText || !statusSelection || !statusZoom) return;

      statusText.textContent = message;

      const vehicle = getSelectedVehicle();
      const vehicleState = getSelectedState();
      const event = getSelectedEvent();

      if (event) {
        statusSelection.textContent = `Selected: ${event.label}`;
      } 
      else if (vehicleState && vehicle) {
        statusSelection.textContent = `Selected: ${vehicle.label} / ${vehicleState.stateLabel}`;
      } 
      else if (vehicle) {
        statusSelection.textContent = `Selected: ${vehicle.label}`;
      } 
      else {
        statusSelection.textContent = 'No selection';
      }

      statusZoom.textContent = `Scale: ${state.camera.zoom.toFixed(1)} px/ft`;
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      drawGrid(rect.width, rect.height);
      if (state.showPaths) drawPaths();
      for (const vehicle of state.vehicles) {
        for (const vehicleState of vehicle.states) {
          drawVehicleState(vehicle, vehicleState);
        }
      }
      if (state.showPaths) drawEvents();
      updateStatusBar();
    }

function drawGrid(width, height) {
  const gridFt = 10;
  const majorGridFt = 50;
  const worldPaddingFt = 100;

  const step = gridFt * state.camera.zoom;
  if (step < 6) return;

  const topLeft = screenToWorld(0, 0);
  const bottomRight = screenToWorld(width, height);

  const startX = Math.floor((topLeft.x - worldPaddingFt) / gridFt) * gridFt;
  const endX = Math.ceil((bottomRight.x + worldPaddingFt) / gridFt) * gridFt;
  const startY = Math.floor((topLeft.y - worldPaddingFt) / gridFt) * gridFt;
  const endY = Math.ceil((bottomRight.y + worldPaddingFt) / gridFt) * gridFt;

  ctx.save();
  ctx.lineWidth = 1;

  for (let x = startX; x <= endX; x += gridFt) {
    const a = worldToScreen(x, startY);
    const b = worldToScreen(x, endY);

    ctx.strokeStyle =
      x % majorGridFt === 0
        ? 'rgba(56, 189, 248, 0.15)'
        : 'rgba(56, 189, 248, 0.06)';

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  for (let y = startY; y <= endY; y += gridFt) {
    const a = worldToScreen(startX, y);
    const b = worldToScreen(endX, y);

    ctx.strokeStyle =
      y % majorGridFt === 0
        ? 'rgba(56, 189, 248, 0.15)'
        : 'rgba(56, 189, 248, 0.06)';

    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  ctx.restore();
}

    function drawPaths() {
      for (const vehicle of state.vehicles) {
        const ordered = vehicle.states;
        if (ordered.length < 2) continue;
        ctx.save();
        ctx.strokeStyle = vehicle.color;
        ctx.globalAlpha = 0.38;
        ctx.setLineDash([8, 7]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ordered.forEach((s, i) => {
          const p = worldToScreen(s.x, s.y);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        ctx.restore();
      }
    }

    function distanceBetweenStatesIds(stateId1, stateId2)
    {
      state1 = findState(stateId1);
      state2 = findState(stateId2);
      return distanceBetweenStates(state1, state2);
    }

    function drawYawRadiusArc(e, a, b, selected) {
      const radiusFt = Number(e.inputs.yawRadiusFt || e.inputs.radiusFt || 0);
      if (!radiusFt || radiusFt <= 0) return;

      const r = radiusFt * state.camera.zoom;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);

      // Cannot draw an arc of this radius through both points
      if (d <= 0 || d > 2 * r) return;

      const mid = {
        x: (a.x + b.x) / 2,
        y: (a.y + b.y) / 2
      };

      const h = Math.sqrt((r * r) - ((d / 2) * (d / 2)));

      // Perpendicular unit vector
      const nx = -dy / d;
      const ny = dx / d;

      // Choose which side of the chord the yaw center is on
      // Use 1 or -1. Flip this if the arc draws on the wrong side.
      const side = e.inputs.yawDirection === 'ccw' ? -1 : 1;

      const center = {
        x: mid.x + nx * h * side,
        y: mid.y + ny * h * side
      };

      const startAngle = Math.atan2(a.y - center.y, a.x - center.x);
      const endAngle = Math.atan2(b.y - center.y, b.x - center.x);

      let delta = endAngle - startAngle;

      // Force the shorter arc between the two states
      while (delta > Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;

      ctx.save();
      ctx.strokeStyle = selected ? '#facc15' : '#94a3b8';
      ctx.lineWidth = selected ? 2 : 1.5;
      ctx.globalAlpha = selected ? 0.55 : 0.35;
      ctx.setLineDash([8, 8]);

      ctx.beginPath();
      ctx.arc(
        center.x,
        center.y,
        r,
        startAngle,
        startAngle + delta,
        delta < 0
      );
      ctx.stroke();

      // Position label halfway along arc
      const midAngle = startAngle + (delta / 2);

      const labelX = center.x + Math.cos(midAngle) * (r + 12);
      const labelY = center.y + Math.sin(midAngle) * (r + 12);

      ctx.fillStyle = selected ? '#facc15' : '#94a3b8';
      ctx.globalAlpha = selected ? 0.9 : 0.7;
      ctx.font = '11px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillText(`r = ${radiusFt.toFixed(0)} ft`, labelX, labelY);

      ctx.restore();
    }
    
    function drawEvents() {
      for (const e of state.events) {
        const from = findState(e.fromStateId);
        const to = findState(e.toStateId);
        const vehicle = findVehicle(e.vehicleId);
        if (!from || !to || !vehicle) continue;

        const a = worldToScreen(from.x, from.y);
        const b = worldToScreen(to.x, to.y);
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const selected = e.id === state.selectedEventId;
        const eventDef = getEventDefinition(e.eventType);

        ctx.save();

        const normalEventColor = '#22c55e';
        const selectedEventColor = '#facc15';

        ctx.strokeStyle = selected ? selectedEventColor : normalEventColor;
        ctx.fillStyle = selected ? selectedEventColor : normalEventColor;
        ctx.lineWidth = selected ? 4 : 2;
        ctx.globalAlpha = selected ? 1 : 0.9;

        if (e.eventType === 'yaw') {
          drawYawRadiusArc(e, a, b, selected);
        }

        drawArrow(a.x, a.y, b.x, b.y);

        ctx.font = '12px system-ui';
        ctx.textAlign = 'center';

        ctx.fillText(eventDef.label, mid.x, mid.y - 8);

        const distance = distanceBetweenStatesIds(e.fromStateId, e.toStateId).toFixed(2);
        ctx.fillText(distance + " ft", mid.x, mid.y + 16);

        ctx.restore();
      }
    }

function drawArrow(x1, y1, x2, y2) {
  const headLength = 12;
  const endOffset = 18;

  const angle = Math.atan2(y2 - y1, x2 - x1);

  const endX = x2 - endOffset * Math.cos(angle);
  const endY = y2 - endOffset * Math.sin(angle);

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(endX, endY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(endX, endY);
  ctx.lineTo(
    endX - headLength * Math.cos(angle - Math.PI / 6),
    endY - headLength * Math.sin(angle - Math.PI / 6)
  );
  ctx.lineTo(
    endX - headLength * Math.cos(angle + Math.PI / 6),
    endY - headLength * Math.sin(angle + Math.PI / 6)
  );
  ctx.closePath();
  ctx.fill();
}

    // Helper function for drawVehicleState() to draw CoG
    function getCogLocalX(vehicle, lengthPx) {
      const rearAxleX = -lengthPx * 0.25;
      const frontAxleX = lengthPx * 0.25;
      const wheelbasePx = frontAxleX - rearAxleX;

      let fractionFromRear = 0.60; // default: 60% from rear axle, 40% from front axle

      const lxf = Number(vehicle.lxf);
      const lxr = Number(vehicle.lxr);

      if (Number.isFinite(lxf) && Number.isFinite(lxr) && lxf > 0 && lxr > 0) {
        fractionFromRear = lxr / (lxf + lxr);
      } else {
        let frontRatio = Number(vehicle.weightRatioFront ?? vehicle.weightFrontRatio);
        if (Number.isFinite(frontRatio) && frontRatio > 0) {
          if (frontRatio > 1) frontRatio /= 100;
          fractionFromRear = frontRatio;
        }
      }

      return rearAxleX + fractionFromRear * wheelbasePx;
    }

    function drawVehicleState(vehicle, s) {
      const cogScreen = worldToScreen(s.x, s.y);
      const lengthPx = vehicle.length * state.camera.zoom;
      const widthPx = vehicle.width * state.camera.zoom;
      const angle = degToRad(s.headingDeg);
      const selected = s.id === state.selectedStateId;

      const cogX = getCogLocalX(vehicle, lengthPx);
      const bodyOffsetX = -cogX;

      ctx.save();
      ctx.translate(cogScreen.x, cogScreen.y);
      ctx.rotate(angle);
      ctx.translate(bodyOffsetX, 0);

      ctx.fillStyle = selected ? '#1d4ed8' : '#334155';
      ctx.strokeStyle = selected ? '#ffffff' : vehicle.color;
      ctx.lineWidth = selected ? 3 : 2;
      roundRect(ctx, -lengthPx / 2, -widthPx / 2, lengthPx, widthPx, 5);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      const axleInset = lengthPx * 0.25;
      [-axleInset, axleInset].forEach(ax => {
        ctx.beginPath();
        ctx.moveTo(ax, -widthPx / 2 - 4);
        ctx.lineTo(ax, widthPx / 2 + 4);
        ctx.stroke();
      });

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.moveTo(lengthPx / 2 - 4, 0);
      ctx.lineTo(lengthPx / 2 - 18, -widthPx * 0.25);
      ctx.lineTo(lengthPx / 2 - 18, widthPx * 0.25);
      ctx.closePath();
      ctx.fill();

      // CoG symbol
      const cogR = Math.max(5, Math.min(widthPx * 0.22, 10));

      ctx.save();
      ctx.translate(cogX, 0);

      ctx.strokeStyle = '#f8fafc';
      ctx.fillStyle = '#020617';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.arc(0, 0, cogR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-cogR * 1.4, 0);
      ctx.lineTo(cogR * 1.4, 0);
      ctx.moveTo(0, -cogR * 1.4);
      ctx.lineTo(0, cogR * 1.4);
      ctx.stroke();

      ctx.restore();

      ctx.translate(-bodyOffsetX, 0);
      ctx.rotate(-angle);

      ctx.fillStyle = '#e5e7eb';
      ctx.font = '12px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(`${vehicle.label} / ${s.stateLabel}`, 0, -widthPx / 2 - 14);
      if (s.speedMph != null) ctx.fillText(`${s.speedMph} mph`, 0, widthPx / 2 + 22);

      ctx.restore();
    }


    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function hitTestVehicleState(worldPoint) {
      for (let vi = state.vehicles.length - 1; vi >= 0; vi--) {
        const vehicle = state.vehicles[vi];
        for (let si = vehicle.states.length - 1; si >= 0; si--) {
          const s = vehicle.states[si];
          const dx = worldPoint.x - s.x;
          const dy = worldPoint.y - s.y;
          const a = -degToRad(s.headingDeg);
          const localX = dx * Math.cos(a) - dy * Math.sin(a);
          const localY = dx * Math.sin(a) + dy * Math.cos(a);
          if (Math.abs(localX) <= s.length / 2 && Math.abs(localY) <= s.width / 2) {
            return { vehicle, vehicleState: s };
          }
        }
      }
      return null;
    }

    function findVehicle(vehicleId) {
      return state.vehicles.find(v => v.id === vehicleId) || null;
    }

    function findState(stateId) {
      for (const vehicle of state.vehicles) {
        const match = vehicle.states.find(s => s.id === stateId);
        if (match) return match;
      }
      return null;
    }

    function getSelectedState() { return findState(state.selectedStateId); }
    function getSelectedVehicle() { return findVehicle(state.selectedVehicleId); }
    function getSelectedEvent() { return state.events.find(e => e.id === state.selectedEventId) || null; }

    function selectState(vehicleId, stateId) {
      state.selectedVehicleId = vehicleId;
      state.selectedStateId = stateId;
      state.selectedEventId = null;
      renderInspector();
      draw();
    }

    function selectVehicleOnly(vehicleId) {
      state.selectedVehicleId = vehicleId;
      state.selectedStateId = null;
      state.selectedEventId = null;
      renderInspector();
      draw();
    }

    function selectEvent(eventId) {
      const e = state.events.find(x => x.id === eventId);
      state.selectedEventId = eventId;
      state.selectedVehicleId = e?.vehicleId || null;
      state.selectedStateId = null;
      renderInspector();
      draw();
    }

    function clearSelection() {
      state.selectedVehicleId = null;
      state.selectedStateId = null;
      state.selectedEventId = null;
      renderInspector();
      draw();
    }

    function renderInspector() {
      const vehicle = getSelectedVehicle();
      const vehicleState = getSelectedState();
      const event = getSelectedEvent();

      inspectorContent.innerHTML = `
        ${renderVehicleNavigator()}
        ${event ? renderEventInspector(event) : vehicleState ? renderStateInspector(vehicle, vehicleState) : vehicle ? renderVehicleInspector(vehicle) : '<div class="muted">Select a vehicle state, vehicle, or event.</div>'}
      `;

      wireNavigatorEvents();
      wireInspectorInputs(vehicle, vehicleState, event);
    }

  const vehiclesHtml = state.vehicles.map(vehicle => `
    <div class="vehicle-nav-group">

}
