    function renderEventInspector(event) {
      ensureEventInputs(event);
      const vehicle = findVehicle(event.vehicleId);
      const eventDef = getEventDefinition(event.eventType);
      return `
        <h3>Event Properties</h3>
        <div class="field">
          <label>Event label</label>
          <input data-target="event" data-prop="label" value="${escapeHtml(event.label)}" />
        </div>
        <div class="field">
          <label>Event type</label>
          <select data-target="event" data-prop="eventType">
            ${Object.entries(eventTypeRegistry).map(([key, def]) => `<option value="${key}" ${key === event.eventType ? 'selected' : ''}>${escapeHtml(def.label)}</option>`).join('')}
          </select>
        </div>
        <!--
        <div class="field">
          <label>Vehicle</label>
          <select data-target="event" data-prop="vehicleId">
            ${state.vehicles.map(v => `<option value="${v.id}" ${v.id === event.vehicleId ? 'selected' : ''}>${escapeHtml(v.label)}</option>`).join('')}
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label>From state</label>
            <select data-target="event" data-prop="fromStateId">
              ${(vehicle?.states || []).map(s => `<option value="${s.id}" ${s.id === event.fromStateId ? 'selected' : ''}>${escapeHtml(s.stateLabel)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>To state</label>
            <select data-target="event" data-prop="toStateId">
              ${(vehicle?.states || []).map(s => `<option value="${s.id}" ${s.id === event.toStateId ? 'selected' : ''}>${escapeHtml(s.stateLabel)}</option>`).join('')}
            </select>
          </div>
        </div>
        -->
        <!-- ${renderEventGeometrySummary(event)} -->
        ${eventDef.renderFields(event)}
        <!--
        <div class="field">
          <label>Notes</label>
          <textarea rows="4" data-target="event" data-prop="notes">${escapeHtml(event.notes)}</textarea>
        </div>
        <div class="inline-actions">
          <button data-action="calculate-event">Calculate Event</button>
          <button data-action="clear-event-calcs">Clear Calculations</button>
        </div>
        -->
      `;
    }

    function renderEventGeometrySummary(event) {
      const from = findState(event.fromStateId);
      const to = findState(event.toStateId);
      const distance = from && to ? distanceBetweenStates(from, to) : 0;
      const headingDelta = from && to ? normalizeAngle(to.headingDeg - from.headingDeg) : 0;
      return `
        <div class="card">
          <strong>Geometry summary</strong><br />
          State distance: ${round(distance, 2)} ft<br />
          Heading change: ${round(headingDelta, 1)}°
        </div>
      `;
    }

    function renderCalculatedOutputs(event) {
      const entries = Object.entries(event.calculated || {});
      if (!entries.length) {
        return '<div class="card calc-card"><strong>Calculated outputs</strong><br /><span class="muted">No calculations yet.</span></div>';
      }
      return `
        <div class="card calc-card">
          <strong>Calculated outputs</strong><br />
          ${entries.map(([key, value]) => `${escapeHtml(key)}: ${escapeHtml(value)}`).join('<br />')}
        </div>
      `;
    }

    function wireNavigatorEvents() {
      inspectorContent.querySelectorAll('[data-select-vehicle]').forEach(el => {
        el.addEventListener('click', () => selectVehicleOnly(el.dataset.selectVehicle));
      });
      inspectorContent.querySelectorAll('[data-select-state]').forEach(el => {
        el.addEventListener('click', () => {
          const [vehicleId, stateId] = el.dataset.selectState.split('|');
          selectState(vehicleId, stateId);
        });
      });
      inspectorContent.querySelectorAll('[data-select-event]').forEach(el => {
        el.addEventListener('click', () => selectEvent(el.dataset.selectEvent));
      });
      inspectorContent.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', () => {
          if (el.dataset.action === 'add-state-to-selected') addStateToSelectedVehicle();
          if (el.dataset.action === 'duplicate-state') duplicateSelectedState();
          if (el.dataset.action === 'add-event-from-state') addEventFromSelectedState();
          if (el.dataset.action === 'calculate-event') calculateSelectedEvent();
          if (el.dataset.action === 'clear-event-calcs') clearSelectedEventCalculations();
        });
      });
    }

    function wireInspectorInputs(vehicle, vehicleState, event) {
      inspectorContent.querySelectorAll('[data-target][data-prop]').forEach(input => {
        input.addEventListener('input', ev => {
          const target = ev.target.dataset.target;
          const prop = ev.target.dataset.prop;
          const value = parseInputValue(ev.target);

          if (target === 'vehicle' && vehicle) {
            vehicle[prop] = value;
            if (prop === 'weightRatioFront') {
              const front = Number(vehicle.weightRatioFront);
              if (Number.isFinite(front) && front >= 0 && front <= 100) {
                vehicle.weightRatioRear = 100 - front;
                const rearInput = document.querySelector('input[data-target="vehicle"][data-prop="weightRatioRear"]');
                rearInput.value = vehicle.weightRatioRear;
              }
            }
          }

          // If x or y changed on the inspector, update trajectory
          if (target === 'state' && vehicleState) {
            vehicleState[prop] = value;
            if (prop === 'x' || prop === 'y') {
              // Update the preceeding state angle based on inspector change of x/y coordinate
              
              for (e of state.events) {
                if (e.toStateId === vehicleState.id || e.fromStateId === vehicleState.id) {
                  const currentState = findState(e.toStateId);
                  const previousState = findState(e.fromStateId);
                  const angleDeg = Math.round((Math.atan2(currentState.y - previousState.y, currentState.x - previousState.x) * 180 / Math.PI));
                  currentState.trajectoryDeg = angleDeg;
                  previousState.trajectoryDeg = angleDeg;
                }
              } 
            } 
          }

          if (target === 'event' && event) {
            if (prop === 'eventType') {
              event.eventType = value;
              event.inputs = getEventDefinition(value).defaultInputs();
              event.calculated = {};
              renderInspector();
              draw();
              return;
            }

            event[prop] = value;

            if (prop === 'vehicleId') {
              const newVehicle = findVehicle(value);
              event.fromStateId = newVehicle?.states[0]?.id || null;
              event.toStateId = newVehicle?.states[1]?.id || newVehicle?.states[0]?.id || null;
              event.calculated = {};
              renderInspector();
              draw();
              return;
            }
          }

          if (target === 'event-input' && event) {
            ensureEventInputs(event);
            event.inputs[prop] = value;
            event.calculated = {};
          }

          draw();
        });
      });
    }

    function parseInputValue(input) {
      if (input.dataset.type === 'boolean') return input.value === 'true';
      if (input.type === 'number') return input.value === '' ? null : Number(input.value);
      return input.value;
    }

    function addVehicle() {
    const vehicle = new Vehicle();
    state.vehicles.push(vehicle);

    const isFirstVehicle = state.vehicles.length === 1;

    const s = addState(vehicle.id, {
      x: isFirstVehicle ? 0 : state.vehicles.length * 8 - 20,
      y: isFirstVehicle ? 0 : state.vehicles.length * 6 - 10

    });

    selectState(vehicle.id, s.id);
    log(`Added ${vehicle.label} with initial state ${s.stateLabel}.`);
    selectVehicleOnly(vehicle.id);
    return vehicle;
  }

    function addState(vehicleId, options = {}) {
      const vehicle = findVehicle(vehicleId);
      if (!vehicle) return null;
      const last = vehicle.states[vehicle.states.length - 1];
      const base = last ? {
        x: last.x + 16,
        y: last.y,
        length: last.length,
        width: last.width,
        headingDeg: last.headingDeg,
        trajectoryDeg: last.trajectoryDeg,
        speedMph: last.speedMph,
        dragFactorFL: last.dragFactorFL,
        dragFactorFR: last.dragFactorFR,
        dragFactorBL: last.dragFactorBL,
        dragFactorBR: last.dragFactorBR,
        massLb: last.massLb
      } : {};
      const s = new VehicleState(vehicle, { ...base, ...options });
      vehicle.states.push(s);
      return s;
    }

    function addStateToSelectedVehicle() {
      const vehicle = getSelectedVehicle() || state.vehicles[0];
      if (!vehicle) return log('Add a vehicle first.', 'warn');
      const s = addState(vehicle.id);
      selectState(vehicle.id, s.id);
      log(`Added ${s.stateLabel} to ${vehicle.label}.`);
    }

    function duplicateSelectedState() {
      const selected = getSelectedState();
      const vehicle = getSelectedVehicle();
      if (!selected || !vehicle) return log('No state selected to duplicate.', 'warn');
      const copy = addState(vehicle.id, {
        x: selected.x + 8,
        y: selected.y + 8,
        length: selected.length,
        width: selected.width,
        headingDeg: selected.headingDeg,
        speedMph: selected.speedMph,
        massLb: selected.massLb,
        stateLabel: `${selected.stateLabel} copy`,
        timeLabel: selected.timeLabel,
        notes: selected.notes
      });
      selectState(vehicle.id, copy.id);
      log(`Duplicated ${selected.stateLabel} for ${vehicle.label}.`);
    }

    function addEventFromSelectedState() {
      const selected = getSelectedState();
      const vehicle = getSelectedVehicle();
      if (!selected || !vehicle) return log('Select a state first.', 'warn');
      let target = vehicle.states[vehicle.states.indexOf(selected) + 1];
      if (!target) target = addState(vehicle.id, { x: selected.x + 20, y: selected.y, speedMph: 0 });
      const event = new EventLink({
        vehicleId: vehicle.id,
        fromStateId: selected.id,
        toStateId: target.id,
        eventType: 'skidContinuedMotion'
      });
      state.events.push(event);
      selectEvent(event.id);
      log(`Added ${event.label}: ${vehicle.label} ${selected.stateLabel} → ${target.stateLabel}.`);
    }

    function addEvent() {
      const vehicle = getSelectedVehicle() || state.vehicles[0];
      if (!vehicle || vehicle.states.length < 1) return log('Add a vehicle before adding an event.', 'warn');
    
      const from = getSelectedState() || vehicle.states[0];
      const existingEvent = state.events.find(e => e.fromStateId === from.id);
      if (existingEvent) {
        return log(
          `${from.stateLabel} already has an outgoing event (${existingEvent.label}). A state can only be the from state for one event.`,
          'warn'
        );
      }
      let to = vehicle.states[vehicle.states.indexOf(from) + 1];
      if (!to) to = addState(vehicle.id, { x: from.x + 50, y: from.y, speedMph: 0 });
      const event = new EventLink({ vehicleId: vehicle.id, fromStateId: from.id, toStateId: to.id, eventType: 'skidContinuedMotion' });
      state.events.push(event);
      selectEvent(event.id);
      log(`Added ${event.label}.`);
    }

    function calculateSelectedEvent() {
      const event = getSelectedEvent();
      if (!event) return log('Select an event first.', 'warn');
      const context = reconstruction.getEventContext(event.id);
      const def = getEventDefinition(event.eventType);
      const result = def.calculate(context);
      renderInspector();
      draw();
      log(`Calculated ${event.label}: ${JSON.stringify(result)}`);
    }

    function clearSelectedEventCalculations() {
      const event = getSelectedEvent();
      if (!event) return log('Select an event first.', 'warn');
      event.calculated = {};
      renderInspector();
      draw();
      log(`Cleared calculations for ${event.label}.`);
    }

    function deleteSelected() {
      const selectedEvent = getSelectedEvent();
      if (selectedEvent) {
        state.events = state.events.filter(e => e.id !== selectedEvent.id);
        clearSelection();
        log(`Deleted ${selectedEvent.label}.`);
        return;
      }

      const selectedState = getSelectedState();
      const vehicle = getSelectedVehicle();
      if (selectedState && vehicle) {
        vehicle.states = vehicle.states.filter(s => s.id !== selectedState.id);
        state.events = state.events.filter(e => e.fromStateId !== selectedState.id && e.toStateId !== selectedState.id);
        selectVehicleOnly(vehicle.id);
        log(`Deleted ${selectedState.stateLabel}; removed linked events.`);
        return;
      }

      if (vehicle) {
        state.vehicles = state.vehicles.filter(v => v.id !== vehicle.id);
        state.events = state.events.filter(e => e.vehicleId !== vehicle.id);
        clearSelection();
        log(`Deleted ${vehicle.label} and its states/events.`);
        return;
      }

      log('Nothing selected to delete.', 'warn');
    }

    function resetView() {
      state.camera = { x: 0, y: 0, zoom: 8 };
      draw();
      log('View reset.');
    }

    function normalizeAngle(deg) {
      let a = deg % 360;
      if (a > 180) a -= 360;
      if (a < -180) a += 360;
      return a;
    }

    function degToRad(deg) { return deg * Math.PI / 180; }
    function radToDeg(rad) { return rad * 180 / Math.PI; }


function distancePointToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;

  if (dx === 0 && dy === 0) {
    return Math.hypot(px - x1, py - y1);
  }

  const t = Math.max(0, Math.min(1,
    ((px - x1) * dx + (py - y1) * dy) / (dx * dx + dy * dy)
  ));

  const closestX = x1 + t * dx;
  const closestY = y1 + t * dy;

  return Math.hypot(px - closestX, py - closestY);
}

function hitTestEvent(worldPoint) {
  const tolerance = 10 / state.camera.zoom;

  for (let i = state.events.length - 1; i >= 0; i--) {
    const event = state.events[i];

    const vehicle = findVehicle(event.vehicleId);
    if (!vehicle) continue;

    const fromState = vehicle.states.find(s => s.id === event.fromStateId);
    const toState = vehicle.states.find(s => s.id === event.toStateId);

    if (!fromState || !toState) continue;

    const dist = distancePointToSegment(
      worldPoint.x,
      worldPoint.y,
      fromState.x,
      fromState.y,
      toState.x,
      toState.y
    );

    if (dist <= tolerance) {
      return event;
    }
  }

  return null;
}
 

canvas.addEventListener('pointerdown', event => {
  canvas.setPointerCapture(event.pointerId);
  const world = screenToWorld(event.clientX, event.clientY);

  const hitState = hitTestVehicleState(world);
  const hitEvent = hitTestEvent(world);

  if (event.button === 1 || event.button === 2) {
    state.interaction = {
      mode: 'pan',
      pointerStart: { x: event.clientX, y: event.clientY },
      cameraStart: { ...state.camera }
    };
    return;
  }

  if (hitState) {
    selectState(hitState.vehicle.id, hitState.vehicleState.id);
    state.interaction = {
      mode: event.shiftKey ? 'rotateState' : 'dragState',
      pointerStart: world,
      stateStart: {
        x: hitState.vehicleState.x,
        y: hitState.vehicleState.y,
        headingDeg: hitState.vehicleState.headingDeg
      }
    };
  } else if (hitEvent) {
    selectEvent(hitEvent.id);
  } else {
    clearSelection();
  }
});

    canvas.addEventListener('pointermove', event => {
      const interaction = state.interaction;
      if (!interaction.mode) return;

      if (interaction.mode === 'pan') {
        const dx = (event.clientX - interaction.pointerStart.x) / state.camera.zoom;
        const dy = (event.clientY - interaction.pointerStart.y) / state.camera.zoom;
        state.camera.x = interaction.cameraStart.x + dx;
        state.camera.y = interaction.cameraStart.y + dy;
        draw();
        return;
      }

      const s = getSelectedState();
      if (!s) return;
      const world = screenToWorld(event.clientX, event.clientY);

      if (interaction.mode === 'dragState') {
        s.x = interaction.stateStart.x + (world.x - interaction.pointerStart.x);
        s.y = interaction.stateStart.y + (world.y - interaction.pointerStart.y);
        // If there is an event connecting this to a previous state, need to calculate trajectory
        // Need to look through the events and see if any have this state as a "to"
        for (e of state.events) {
          if (e.toStateId === s.id || e.fromStateId === s.id) {
            const currentState = findState(e.toStateId);
            const previousState = findState(e.fromStateId);
            const angleDeg = Math.round((Math.atan2(currentState.y - previousState.y, currentState.x - previousState.x) * 180 / Math.PI));
            currentState.trajectoryDeg = angleDeg;
            previousState.trajectoryDeg = angleDeg;
          }
        }
        renderInspector();
        draw();
      }

      if (interaction.mode === 'rotateState') {
        const angle = Math.atan2(world.y - s.y, world.x - s.x);
        s.headingDeg = Math.round(radToDeg(angle));
        renderInspector();
        draw();
      }
    });

    canvas.addEventListener('pointerup', () => {
      if (state.interaction.mode === 'dragState' || state.interaction.mode === 'rotateState') {
        const s = getSelectedState();
        const v = getSelectedVehicle();
      }
      state.interaction = { mode: null, pointerStart: null, stateStart: null, cameraStart: null };
    });

    canvas.addEventListener('contextmenu', event => event.preventDefault());

    canvas.addEventListener('wheel', event => {
      event.preventDefault();
      const zoomFactor = event.deltaY < 0 ? 1.1 : 0.9;
      state.camera.zoom = Math.min(8, Math.max(0.15, state.camera.zoom * zoomFactor));
      draw();
    }, { passive: false });

    document.getElementById('addVehicleBtn').addEventListener('click', addVehicle);
    document.getElementById('addEventBtn').addEventListener('click', addEvent);
    document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
    document.getElementById('resetViewBtn').addEventListener('click', resetView);

    window.addEventListener('resize', resizeCanvas);

    const reconstruction = {
      getVehicleTimeline(vehicleId) {
        const vehicle = findVehicle(vehicleId);
        if (!vehicle) return [];
        return vehicle.states.map(s => ({ ...s }));
      },
      getEventContext(eventId) {
        const event = state.events.find(e => e.id === eventId);
        if (!event) return null;
        return {
          event,
          from: findState(event.fromStateId),
          to: findState(event.toStateId),
          vehicle: findVehicle(event.vehicleId)
        };
      },
      calculateEvent(eventId) {
        const context = this.getEventContext(eventId);
        if (!context) return null;
        return getEventDefinition(context.event.eventType).calculate(context);
      },
      exportScene() {
        return JSON.stringify({
          vehicles: state.vehicles,
          events: state.events,
          nextVehicleNum: state.nextVehicleNum,
          nextStateNum: state.nextStateNum,
          nextEventNum: state.nextEventNum
        }, null, 2);
      },
      importScene(json) {
        const data = JSON.parse(json);
        state.vehicles = data.vehicles || [];
        state.events = data.events || [];
        state.nextVehicleNum = data.nextVehicleNum || 1;
        state.nextStateNum = data.nextStateNum || 1;
        state.nextEventNum = data.nextEventNum || 1;
        clearSelection();
        log('Scene imported.');
      }
    };

    window.crashScene = {
      state,
      eventTypeRegistry,
      reconstruction,
      addVehicle,
      addState,
      addEvent,
      calculateSelectedEvent,
      draw
    };

    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalFooter = document.getElementById('modalFooter');

    function openModal({ title = '', body = '', buttons = [] } = {}) {
      modalTitle.textContent = title;
      modalBody.innerHTML = body;

      modalFooter.innerHTML = '';

      buttons.forEach(btn => {
        const button = document.createElement('button');
        button.textContent = btn.label;
        button.className = btn.className || '';

        button.onclick = () => {
          if (btn.onclick) btn.onclick();
          if (btn.close !== false) closeModal();
        };

        modalFooter.appendChild(button);
      });

      modalBackdrop.classList.remove('hidden');
    }

    function closeModal() {
      modalBackdrop.classList.add('hidden');
    }

    resizeCanvas();

        body: `
          <p>Welcome to the Crash Reconstruction Scaffold. </p>
          <p>Select or add a vehicle state to begin.</p>
        `,
        buttons: [
        { label: 'OK', className: 'calc-button' }
        ]
      });
    }); */

    log(`Load complete. Click "Add Vehicle" to get started.`);
    log(`WARNING: You may diagram Yaw but I don't calculate it yet. This is a development branch.`, 'error');

  </script>
